<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommitD — Log in</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/password-toggle.js" defer></script>
  <script src="/js/form-error.js" defer></script>
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">✓</span>CommitD.</a>

    <h1>Log In</h1>

    <form class="stack" method="post" action="/login">
      <label class="field">
        Email address
        <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </label>

      <label class="field">
        Password
        <span class="password">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="link-btn" data-toggle-password="password">Show</button>
        </span>
      </label>

      <p class="error" role="alert"></p>

      <button class="btn primary big wide" type="submit">Log in →</button>
    </form>

    <p class="switch">New here? <a href="/signup.html">Create an account</a></p>
  </section>
</main>
</body>
</html>
