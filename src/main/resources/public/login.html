<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairShare — Log in</title>
  <style>
    :root{color-scheme:light;--ink:#242a24;--muted:#697269;--green:#245343;--line:#dce1d8;--paper:#f9f8f5;--soft:#e8efe9}
    *{box-sizing:border-box}body{margin:0;background:#f2f2f2;color:var(--ink);font:14px system-ui,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}a,.link{color:var(--green)}button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}
    .field{font-weight:500;margin-bottom:15px}.field:has(+ .fine){margin-bottom:0}
    .auth{min-height:calc(100dvh - 28px);margin:14px auto;background:var(--paper);width:min(94%,640px);padding:48px 24px}.auth-inner{max-width:368px;margin:auto}h1{font-size:34px;letter-spacing:-.045em;font-weight:600;line-height:1.13;margin:0 0 10px}p{margin:0 0 24px;color:var(--muted)}label.field{display:block;font-weight:500;margin-bottom:15px}input:not([type=checkbox]),select{display:block;width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:#fefefe;color:var(--ink);padding:0 14px;margin-top:6px}input::placeholder{color:var(--muted)}.password{position:relative;display:block}.password input{padding-right:48px}.eye{position:absolute;right:8px;top:8px}.icon,.link{background:none;border:0;padding:7px}.eye svg{display:block}.button{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:48px;padding:0 15px;font-weight:600}.primary{background:var(--green);border-color:var(--green);color:white}.button:hover{filter:brightness(.95)}.wide{width:100%}.arrow{margin-left:9px}.options{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 14px;color:var(--muted);font-size:13px}.options input{vertical-align:middle;accent-color:var(--green);margin-left:0}.switch{text-align:center;margin-top:24px}.switch a{font-weight:600;text-decoration:none}.fine{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin:9px 0 15px;font-weight:400}.legal{margin-top:16px}.notice{color:var(--green);font-size:13px;margin:12px 0 0}.notice:empty{display:none}
    .workspace{min-height:100dvh;background:#f5f7f4;max-width:1320px;margin:auto}.top{background:white;border-bottom:1px solid var(--line);padding:16px 30px;display:flex;gap:18px;align-items:center}.crumb{margin-right:auto}.muted{color:var(--muted)}.search{max-width:250px}.top .search{margin:0;min-height:36px;background:#f1f4ee;border:0}.avatar{border:0;background:var(--soft);color:var(--green);border-radius:50%;height:34px;min-width:34px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:27px 30px}.sidebar{border:1px solid var(--line);border-radius:13px;background:#f1f4ee;min-height:75vh}.sidebar header{padding:16px;border-bottom:1px solid var(--line)}.sidebar small{letter-spacing:.1em;color:var(--muted)}.sidebar strong{display:block;font-size:18px}.nav{padding:10px}.nav button{border:0;border-radius:10px;width:100%;display:flex;align-items:center;text-align:left;gap:10px;padding:10px;background:transparent}.nav button[aria-current=true]{background:var(--soft)}.nav i{font-style:normal;color:var(--green);background:white;border-radius:9px;padding:6px 9px}.nav small{display:block;letter-spacing:0}.hero{display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:30px}.date{white-space:nowrap;color:var(--muted);font-size:12px}.toolbar{text-align:right;margin:20px 0}.toolbar .button{min-height:38px}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.card header{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:650}.count{display:inline-block;background:#f1f4ee;border-radius:5px;padding:2px 7px;margin-left:8px;font-size:11px;color:var(--muted)}.rows{padding:0 22px}.row{display:grid;grid-template-columns:18px 1fr auto;align-items:start;gap:9px;padding:15px 0;border-bottom:1px solid var(--line)}.row .icon{padding:0 4px;color:var(--muted)}.ring{color:var(--green);font-size:18px;line-height:1}.row small{display:block;color:var(--muted);margin-top:7px}.progress{display:flex;gap:7px;align-items:center;margin-top:6px;font-size:10px;color:var(--muted)}progress{width:48px;height:5px;appearance:none}progress::-webkit-progress-bar{background:var(--soft);border-radius:8px}progress::-webkit-progress-value{background:var(--green);border-radius:8px}progress::-moz-progress-bar{background:var(--green)}.card footer{padding:7px 15px}.card footer button{width:100%;text-align:left}.card footer span{float:right}.empty{padding:22px 0;margin:0}.menu{display:flex;justify-content:flex-end;gap:8px;grid-column:2/-1;flex-wrap:wrap}.menu .button{min-height:32px;font-size:12px}dialog{width:min(420px,calc(100% - 32px));border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:24px;color:var(--ink)}dialog::backdrop{background:#202b2580}dialog h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:700px){.layout{grid-template-columns:1fr;padding:18px;gap:18px}.sidebar{min-height:0}.sidebar header{display:none}.nav{display:flex;gap:4px}.nav button{justify-content:center;font-size:12px}.nav small,.nav i,.date{display:none}.top{padding:12px;gap:8px}.crumb{font-size:12px}.search{max-width:140px}.hero h1{font-size:27px}.rows{padding:0 14px}.progress{white-space:nowrap}}
    .auth-brand{display:inline-flex;gap:10px;align-items:center;margin-bottom:42px;font-size:20px;font-weight:700;letter-spacing:-.6px;text-decoration:none;color:var(--ink)}.auth-mark{display:grid;place-items:center;background:var(--green);color:#fff;width:29px;height:31px;clip-path:polygon(0 0,100% 0,100% 66%,50% 100%,0 66%)}.workspace-link{display:block;text-align:center;font-size:12px;margin-top:20px}.auth{border-radius:12px}.notice{color:#985b4b}.fine.legal{margin-top:16px}</style>
</head>
<body>
<main id="app"></main>
<dialog id="modal"></dialog>
<script>
  // Browser-local identity store. This is not authentication.
  window.FairShareAccounts = (() => {
    const key = 'fairshare-accounts-v1';
    const defaults = ['Alice','Bob','Carol','David'].map((name,i)=>({id:'demo-'+i,name,email:name.toLowerCase()+'@example.com'}));
    function read(){try{const value=JSON.parse(localStorage.getItem(key));if(value?.accounts?.length)return value}catch{}return {accounts:defaults.map(a=>({...a})),accountId:'demo-0'}}
    function write(value){localStorage.setItem(key,JSON.stringify(value))}
    function signup(name,email,github){const data=read();name=name.trim();email=email.trim().toLowerCase();if(!name)throw new Error('Enter your full name.');if(data.accounts.some(a=>a.email.toLowerCase()===email))throw new Error('That email is already registered. Log in instead.');const user={id:crypto.randomUUID(),name,email,githubEmail:github.trim().toLowerCase()};data.accounts.push(user);data.accountId=user.id;write(data);return user}
    function login(email){const data=read(),user=data.accounts.find(a=>a.email.toLowerCase()===email.trim().toLowerCase());if(!user)throw new Error('No account found in this browser. Create an account first.');data.accountId=user.id;write(data);return user}
    function logout(){const data=read();data.accountId=null;write(data)}
    return {read,signup,login,logout};
  })();

</script>
<script>
  const app=document.querySelector('#app');const modal=document.querySelector('#modal');
  const eye = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
  const field = (label, name, placeholder, type='text', extra='') => `<label class="field">${label}<input name="${name}" type="${type}" placeholder="${placeholder}" required ${extra}></label>`;
  function auth(mode) {
    const signup = mode === 'signup';
    const reset = mode === 'reset';
    app.innerHTML = `<section class="auth"><div class="auth-inner"><a class="auth-brand" href="index.html"><span class="auth-mark">✓</span>FairShare.</a>
      <h1>${signup ? 'Make room for more.' : reset ? 'Reset your password.' : 'Welcome back.'}</h1>
      <p>${signup ? 'Create your account. A fresh start is a few details away.' : reset ? 'Enter the email address for your account.' : 'Make yourself at home. Log in to your workspace.'}</p>
      <form id="auth-form">
        ${signup ? field('Full name','name','Alex Morgan','text','autocomplete="name"') : ''}
        ${field('Email address','email','you@example.com','email','autocomplete="email"')}
        ${reset ? '' : `<div class="field"><label for="password">Password</label><span class="password"><input id="password" name="password" type="password" placeholder="${signup ? 'Create a password' : 'Enter your password'}" required autocomplete="${signup ? 'new-password' : 'current-password'}" ${signup ? 'minlength="8" pattern=".*[0-9].*" title="Use at least 8 characters, including a number." aria-describedby="password-hint"' : ''}><button type="button" class="icon eye" data-action="password" aria-label="Show password">${eye}</button></span></div>`}
        ${signup ? '<span class="fine" id="password-hint">Use at least 8 characters, including a number.</span>' + field('GitHub email','github','you@github.com','email') : ''}
        ${mode === 'login' ? '<div class="options"><span>Saved in this browser</span><a href="#reset">Forgot password?</a></div>' : ''}
        <button class="button primary wide">${signup ? 'Create account' : reset ? 'Request reset' : 'Log in'} <span class="arrow" aria-hidden="true">→</span></button>
      </form>
      <p class="notice" role="status"></p>
      ${signup ? '<p class="fine legal"><a href="signup.html" data-action="terms">Terms of Service</a> and <a href="signup.html" data-action="privacy">Privacy Policy</a>.</p>' : ''}
      <p class="switch">${signup ? 'Already have an account?  <a href="login.html">Log in</a>' : reset ? '<a href="login.html">Back to log in</a>' : 'New here?  <a href="signup.html">Create an account</a>'}</p>

    </div></section>`;
    app.querySelector('#auth-form').onsubmit = event => {
      event.preventDefault();
      if (reset) return notice('Password reset is not available yet.');
      const data = new FormData(event.currentTarget);
      try {
        if (signup) FairShareAccounts.signup(data.get('name'),data.get('email'),data.get('github'));
        else FairShareAccounts.login(data.get('email'));
        location.href = 'index.html';
      } catch(error) { notice(error.message); }

    };
  }
  function notice(message) { app.querySelector('.notice').textContent = message; }

  function message(title,text){modal.innerHTML=`<h2>${title}</h2><p>${text}</p><form method="dialog" class="actions"><button class="button">Close</button></form>`;modal.showModal()}
  document.addEventListener('click',event=>{const control=event.target.closest('[data-action]');if(!control)return;event.preventDefault();const action=control.dataset.action;if(action==='password'){const input=document.querySelector('#password');input.type=input.type==='password'?'text':'password';control.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password')}if(action==='terms')message('Terms of Service','Terms of Service have not been supplied yet.');if(action==='privacy')message('Privacy Policy','Your name, email, GitHub email and projects are saved in this browser. Passwords are not stored or verified. There is no authentication server connected.')});
  function route(){auth(location.hash==='#reset'?'reset':'login')}window.addEventListener('hashchange',route);route();
</script></body></html>
